[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="ziegler-procurement-agent"
version="0.1.0"
description="Local, approval-gated procurement assistant"
requires-python=">=3.12"

[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
addopts="-q"
